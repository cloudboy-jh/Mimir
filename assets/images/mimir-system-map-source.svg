<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">How Mimir captures and serves agent memory</title>
  <desc id="desc">The installed agent harness captures work through full proxy exchanges, bounded direct-provider reconstructions, and lifecycle events. The private Mimir Worker authenticates, redacts, persists, and coordinates sessions. The separate Mimir CLI installs and configures Mimir, then searches and inspects saved sessions.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2dd4bf"/></marker>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a1a19b"/></marker>
    <style>
      .sans { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; }
      .title { fill:#f2f2ef; font-size:30px; font-weight:600; letter-spacing:-.6px }
      .subtitle { fill:#a1a19b; font-size:15px }
      .section { fill:#a1a19b; font-size:12px; font-weight:600; letter-spacing:1.4px }
      .heading { fill:#f2f2ef; font-size:20px; font-weight:600 }
      .subheading { fill:#e7e7e2; font-size:16px; font-weight:600 }
      .body { fill:#c9c9c4; font-size:15px }
      .micro { fill:#a1a19b; font-size:12px }
      .machine { fill:#e7e7e2; font-size:13px }
      .panel { fill:#191918; stroke:#41413d; stroke-width:1 }
      .inner { fill:#20201f; stroke:#41413d; stroke-width:1 }
      .boundary { fill:#151514; stroke:#62625d; stroke-width:1; stroke-dasharray:5 5 }
      .rule { stroke:#363633; stroke-width:1 }
      .flow-proxy { fill:none; stroke:#2dd4bf; stroke-width:2.5; marker-end:url(#arrow-teal) }
      .flow-exchange { fill:none; stroke:#a1a19b; stroke-width:2; marker-end:url(#arrow-ink) }
      .flow-event { fill:none; stroke:#a1a19b; stroke-width:2; stroke-dasharray:6 6; marker-end:url(#arrow-ink) }
      .flow-api { fill:none; stroke:#a1a19b; stroke-width:2; marker-start:url(#arrow-ink); marker-end:url(#arrow-ink) }
      .flow-upstream { fill:none; stroke:#2dd4bf; stroke-width:2.5; marker-start:url(#arrow-teal); marker-end:url(#arrow-teal) }
    </style>
  </defs>

  <rect width="1400" height="860" rx="8" fill="#111110"/>
  <rect x=".5" y=".5" width="1399" height="859" rx="7.5" fill="none" stroke="#363633"/>
  <text x="40" y="46" class="sans title">How Mimir captures agent work</text>
  <text x="40" y="73" class="sans subtitle">The harness captures. The Worker makes it durable. The CLI sets it up and searches it.</text>
  <line x1="40" y1="104" x2="1360" y2="104" class="rule"/>

  <rect x="1110" y="24" width="250" height="62" rx="6" class="panel"/>
  <text x="1132" y="49" class="sans subheading">OpenRouter</text>
  <text x="1132" y="70" class="sans micro">model upstream</text>

  <text x="40" y="132" class="sans section">YOUR MACHINE</text>
  <text x="500" y="132" class="sans section">YOUR CLOUDFLARE ACCOUNT</text>

  <rect x="40" y="146" width="390" height="674" rx="7" class="boundary"/>
  <rect x="500" y="146" width="860" height="674" rx="7" class="boundary"/>

  <rect x="64" y="174" width="342" height="420" rx="7" class="panel"/>
  <circle cx="90" cy="205" r="6" fill="#2dd4bf"/>
  <text x="107" y="212" class="sans heading">Agent harness</text>
  <text x="88" y="241" class="sans body">Captures the work as it happens.</text>

  <rect x="88" y="266" width="294" height="88" rx="5" class="inner"/>
  <text x="108" y="292" class="sans subheading">1  Proxied model traffic</text>
  <text x="108" y="317" class="sans body">Adds the exact session ID</text>
  <text x="108" y="339" class="mono micro">complete transport exchange</text>

  <rect x="88" y="370" width="294" height="98" rx="5" class="inner"/>
  <text x="108" y="396" class="sans subheading">2  Direct-provider turn</text>
  <text x="108" y="421" class="sans body">Reconstructs the completed turn</text>
  <text x="108" y="446" class="mono micro">prompt · response · tool activity</text>

  <rect x="88" y="484" width="294" height="86" rx="5" class="inner"/>
  <text x="108" y="510" class="sans subheading">3  Session lifecycle</text>
  <text x="108" y="536" class="sans body">Heartbeat · title · outcome · end</text>
  <text x="108" y="558" class="mono micro">commit + patch evidence</text>

  <rect x="64" y="622" width="342" height="170" rx="7" class="panel"/>
  <circle cx="90" cy="653" r="6" fill="#a1a19b"/>
  <text x="107" y="660" class="sans heading">Mimir CLI</text>
  <text x="88" y="692" class="sans subheading">Setup</text>
  <text x="151" y="692" class="sans body">install · deploy · configure</text>
  <text x="88" y="721" class="sans subheading">Search</text>
  <text x="156" y="721" class="sans body">find sessions · inspect evidence</text>
  <line x1="88" y1="742" x2="382" y2="742" class="rule"/>
  <text x="88" y="769" class="mono machine">does not capture model traffic</text>

  <rect x="524" y="174" width="522" height="618" rx="7" class="panel"/>
  <text x="550" y="211" class="sans heading">Mimir Worker</text>
  <text x="550" y="238" class="sans body">Canonical API and private memory plane</text>

  <rect x="550" y="266" width="470" height="88" rx="5" class="inner"/>
  <text x="574" y="294" class="sans subheading">Model gateway</text>
  <text x="574" y="320" class="sans body">Authenticate · stream upstream · capture asynchronously</text>
  <text x="574" y="342" class="mono micro">preserves the live response</text>

  <rect x="550" y="370" width="470" height="98" rx="5" class="inner"/>
  <text x="574" y="398" class="sans subheading">Evidence pipeline</text>
  <text x="574" y="424" class="sans body">Validate · normalize tools, files, errors · redact</text>
  <text x="574" y="450" class="mono micro">persist full evidence to R2 · index facets in D1</text>

  <rect x="550" y="484" width="470" height="108" rx="5" class="inner"/>
  <text x="574" y="512" class="sans subheading">Session coordinator</text>
  <text x="574" y="538" class="sans body">One Durable Object per exact session ID</text>
  <text x="574" y="564" class="sans body">Liveness · generations · retries · finalization</text>
  <text x="574" y="582" class="mono micro">capture state and work outcome remain separate</text>

  <rect x="550" y="680" width="470" height="82" rx="5" class="inner"/>
  <text x="574" y="710" class="sans subheading">Canonical session API</text>
  <text x="574" y="738" class="sans body">Setup · search · inspect · status · outcomes</text>

  <text x="1090" y="198" class="sans section">DURABLE MEMORY</text>
  <rect x="1080" y="218" width="252" height="142" rx="6" class="panel"/>
  <text x="1104" y="251" class="mono heading">R2</text>
  <text x="1104" y="278" class="sans body">Complete redacted evidence</text>
  <line x1="1104" y1="296" x2="1308" y2="296" class="rule"/>
  <text x="1104" y="321" class="sans micro">Exchanges · transcripts</text>
  <text x="1104" y="342" class="sans micro">Outcome patches</text>

  <rect x="1080" y="394" width="252" height="176" rx="6" class="panel"/>
  <text x="1104" y="427" class="mono heading">D1</text>
  <text x="1104" y="454" class="sans body">Searchable session record</text>
  <line x1="1104" y1="472" x2="1308" y2="472" class="rule"/>
  <text x="1104" y="497" class="sans micro">Tools · files · errors</text>
  <text x="1104" y="519" class="sans micro">Titles · capture · outcomes</text>
  <text x="1104" y="541" class="sans micro">R2 references · machine config</text>

  <rect x="1080" y="680" width="252" height="82" rx="6" class="panel"/>
  <text x="1104" y="711" class="sans subheading">Private dashboard</text>
  <text x="1104" y="738" class="sans body">Browse and investigate sessions</text>

  <path d="M406 310H500V310H550" class="flow-proxy"/>
  <text x="448" y="297" class="mono micro">full proxy</text>
  <path d="M406 420H550" class="flow-exchange"/>
  <text x="440" y="407" class="mono micro">reconstructed</text>
  <path d="M406 530H550" class="flow-event"/>
  <text x="451" y="517" class="mono micro">lifecycle</text>

  <path d="M785 266V116H1235V86" class="flow-upstream"/>
  <text x="920" y="132" class="mono micro">live model stream</text>

  <path d="M1020 420H1050V289H1080" class="flow-exchange"/>
  <text x="1067" y="278" text-anchor="end" class="mono micro">objects</text>
  <path d="M1020 538H1050V482H1080" class="flow-exchange"/>
  <text x="1067" y="471" text-anchor="end" class="mono micro">state + index</text>

  <path d="M406 706H550" class="flow-api"/>
  <text x="436" y="692" class="mono micro">setup + search</text>
  <path d="M1020 721H1080" class="flow-api"/>
</svg>
