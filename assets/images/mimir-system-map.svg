<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">How Mimir records agent work</title>
  <desc id="desc">Complete proxied model traffic and lightweight harness events enter a Mimir Worker inside the developer's Cloudflare account. Full redacted exchanges are stored in R2, session metadata is stored in D1, and both are available through the private dashboard and CLI.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#0f766e"/>
    </marker>
    <style>
      .sans { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; }
      .title { font-size: 27px; font-weight: 600; letter-spacing: -0.5px; fill: #1c1c1a; }
      .section { font-size: 12px; font-weight: 600; letter-spacing: 1.1px; fill: #62625d; }
      .label { font-size: 16px; font-weight: 600; fill: #1c1c1a; }
      .body { font-size: 13px; fill: #62625d; }
      .micro { font-size: 11px; fill: #62625d; }
      .node { fill: #fbfbf9; stroke: #cecec8; stroke-width: 1; }
      .cloud { fill: #eeeee9; stroke: #b9b9b2; stroke-width: 1; }
      .rule { stroke: #cecec8; stroke-width: 1; }
      .flow { fill: none; stroke: #0f766e; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="560" rx="10" fill="#f7f7f5"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="9.5" fill="none" stroke="#deded9"/>

  <text x="48" y="52" class="sans title">How agent work becomes durable memory</text>
  <text x="48" y="78" class="sans body">Two inputs, one private session record inside your Cloudflare account.</text>
  <line x1="48" y1="100" x2="1152" y2="100" class="rule"/>

  <text x="48" y="134" class="sans section">AGENT TRAFFIC</text>
  <text x="398" y="134" class="sans section">YOUR CLOUDFLARE ACCOUNT</text>
  <text x="984" y="134" class="sans section">USE THE MEMORY</text>

  <rect x="380" y="148" width="544" height="334" rx="8" class="cloud"/>

  <rect x="48" y="172" width="268" height="104" rx="7" class="node"/>
  <circle cx="76" cy="201" r="7" fill="#0f766e"/>
  <text x="94" y="207" class="sans label">Proxied model traffic</text>
  <text x="76" y="236" class="sans body">Complete OpenRouter requests</text>
  <text x="76" y="257" class="sans body">and streaming responses</text>

  <rect x="48" y="340" width="268" height="104" rx="7" class="node"/>
  <circle cx="76" cy="369" r="7" fill="#343431"/>
  <text x="94" y="375" class="sans label">Harness events</text>
  <text x="76" y="404" class="sans body">Turns, heartbeats, ends,</text>
  <text x="76" y="425" class="sans body">outcomes, and Git evidence</text>

  <rect x="420" y="172" width="216" height="104" rx="7" class="node"/>
  <text x="444" y="207" class="sans label">Worker proxy</text>
  <text x="444" y="236" class="sans body">Preserve streaming</text>
  <text x="444" y="257" class="sans body">Redact before storage</text>

  <rect x="420" y="340" width="216" height="104" rx="7" class="node"/>
  <text x="444" y="375" class="sans label">Session coordinator</text>
  <text x="444" y="404" class="sans body">Group turns and models</text>
  <text x="444" y="425" class="sans body">Track liveness and outcomes</text>

  <rect x="704" y="172" width="180" height="104" rx="7" class="node"/>
  <text x="728" y="207" class="mono" font-size="15" font-weight="600" fill="#1c1c1a">R2</text>
  <text x="728" y="236" class="sans body">Full redacted</text>
  <text x="728" y="257" class="sans body">exchange objects</text>

  <rect x="704" y="340" width="180" height="104" rx="7" class="node"/>
  <text x="728" y="375" class="mono" font-size="15" font-weight="600" fill="#1c1c1a">D1</text>
  <text x="728" y="404" class="sans body">Sessions, metadata,</text>
  <text x="728" y="425" class="sans body">search index, and config</text>

  <rect x="984" y="226" width="168" height="164" rx="7" class="node"/>
  <text x="1008" y="262" class="sans label">Private surfaces</text>
  <line x1="1008" y1="281" x2="1128" y2="281" class="rule"/>
  <text x="1008" y="314" class="sans body">Session dashboard</text>
  <text x="1008" y="345" class="sans body">Mimir CLI</text>
  <text x="1008" y="370" class="sans micro">Search · inspect · control</text>

  <path d="M316 224H420" class="flow"/>
  <text x="333" y="210" class="mono micro">full exchange</text>
  <path d="M316 392H420" class="flow"/>
  <text x="350" y="378" class="mono micro">events</text>
  <path d="M636 224H704" class="flow"/>
  <path d="M636 392H704" class="flow"/>
  <path d="M884 224H940V282H984" class="flow"/>
  <path d="M884 392H940V334H984" class="flow"/>

  <line x1="48" y1="514" x2="1152" y2="514" class="rule"/>
  <text x="48" y="539" class="sans micro">R2 holds complete proxy captures. D1 holds the session index and operational state. Direct-provider plugin events do not become full exchange archives.</text>
</svg>
