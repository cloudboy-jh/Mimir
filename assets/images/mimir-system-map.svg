<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Mimir system map</title>
  <desc id="desc">Agent harnesses send proxied OpenRouter traffic and lifecycle events to Mimir inside the developer's Cloudflare account. Mimir stores redacted exchanges and session state, then exposes memory through the CLI and private dashboard.</desc>
  <defs>
    <marker id="arrow-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#343431"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#0f766e"/>
    </marker>
    <style>
      .sans { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace; }
      .title { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; fill: #1c1c1a; }
      .section { font-size: 12px; font-weight: 600; letter-spacing: 1.2px; fill: #62625d; }
      .label { font-size: 16px; font-weight: 600; fill: #1c1c1a; }
      .body { font-size: 13px; fill: #62625d; }
      .micro { font-size: 11px; fill: #62625d; }
      .node { fill: #fbfbf9; stroke: #cecec8; stroke-width: 1; }
      .boundary { fill: #eeeee9; stroke: #b9b9b2; stroke-width: 1; }
      .rule { stroke: #cecec8; stroke-width: 1; }
      .solid { fill: none; stroke: #0f766e; stroke-width: 2; marker-end: url(#arrow-teal); }
      .dashed { fill: none; stroke: #343431; stroke-width: 1.6; stroke-dasharray: 6 6; marker-end: url(#arrow-ink); }
      .internal { fill: none; stroke: #85857f; stroke-width: 1.4; marker-end: url(#arrow-ink); }
      .both { fill: none; stroke: #85857f; stroke-width: 1.4; marker-start: url(#arrow-ink); marker-end: url(#arrow-ink); }
    </style>
  </defs>

  <rect width="1200" height="680" rx="10" fill="#f7f7f5"/>
  <rect x="0.5" y="0.5" width="1199" height="679" rx="9.5" fill="none" stroke="#deded9"/>

  <text x="48" y="54" class="sans title">Two capture paths, one private memory plane</text>
  <line x1="48" y1="76" x2="1152" y2="76" class="rule"/>

  <text x="48" y="112" class="sans section">AGENT HARNESS</text>
  <text x="408" y="112" class="sans section">YOUR CLOUDFLARE ACCOUNT</text>
  <text x="942" y="112" class="sans section">EXTERNAL AND LOCAL SURFACES</text>

  <rect x="390" y="126" width="500" height="470" rx="8" class="boundary"/>

  <rect x="48" y="154" width="274" height="110" rx="7" class="node"/>
  <circle cx="78" cy="184" r="8" fill="#0f766e"/>
  <text x="98" y="190" class="sans label">Redirected model traffic</text>
  <text x="78" y="220" class="sans body">Complete OpenRouter requests</text>
  <text x="78" y="241" class="sans body">and streaming responses</text>

  <rect x="48" y="328" width="274" height="110" rx="7" class="node"/>
  <circle cx="78" cy="358" r="8" fill="#343431"/>
  <text x="98" y="364" class="sans label">Harness events</text>
  <text x="78" y="394" class="sans body">Turns, heartbeats, and ends</text>
  <text x="78" y="415" class="sans body">from OpenCode and Hermes</text>

  <path d="M322 209H428" class="solid"/>
  <text x="337" y="194" class="mono micro">full exchange</text>
  <path d="M322 383H428" class="dashed"/>
  <text x="337" y="368" class="mono micro">events</text>

  <rect x="430" y="154" width="190" height="110" rx="7" class="node"/>
  <text x="454" y="188" class="sans label">Worker proxy</text>
  <text x="454" y="216" class="sans body">Stream upstream</text>
  <text x="454" y="237" class="sans body">Redact before capture</text>

  <rect x="430" y="328" width="190" height="110" rx="7" class="node"/>
  <text x="454" y="358" class="sans label">Session coordinator</text>
  <text x="454" y="384" class="sans body">Live summary buffer</text>
  <text x="454" y="405" class="sans body">Liveness and reopening</text>
  <text x="454" y="426" class="sans body">Retries and finalization</text>

  <rect x="676" y="241" width="170" height="142" rx="7" class="node"/>
  <text x="700" y="275" class="sans label">Durable memory</text>
  <line x1="700" y1="294" x2="822" y2="294" class="rule"/>
  <text x="700" y="322" class="mono" font-size="13" fill="#1c1c1a">R2</text>
  <text x="735" y="322" class="sans body">redacted objects</text>
  <text x="700" y="351" class="mono" font-size="13" fill="#1c1c1a">D1</text>
  <text x="735" y="351" class="sans body">metadata + state</text>

  <rect x="553" y="490" width="214" height="70" rx="7" class="node"/>
  <text x="577" y="522" class="sans label">Canonical Worker API</text>
  <text x="577" y="544" class="sans body">Search, inspect, control</text>

  <path d="M620 209H647V276H676" class="internal"/>
  <path d="M620 383H647V348H676" class="internal"/>
  <text x="628" y="333" class="mono micro">state</text>
  <path d="M761 383V457H660V490" class="internal"/>

  <rect x="942" y="154" width="210" height="80" rx="7" class="node"/>
  <text x="966" y="187" class="sans label">OpenRouter</text>
  <text x="966" y="211" class="sans body">Only model upstream</text>
  <path d="M620 181H942" class="solid"/>
  <path d="M942 218H640V238H620" class="solid"/>

  <rect x="942" y="328" width="210" height="148" rx="7" class="node"/>
  <text x="966" y="362" class="sans label">Memory surfaces</text>
  <line x1="966" y1="380" x2="1128" y2="380" class="rule"/>
  <text x="966" y="414" class="sans body">Mimir CLI</text>
  <text x="966" y="446" class="sans body">Private dashboard</text>
  <path d="M767 525H914V422H942" class="both"/>

  <line x1="48" y1="626" x2="1152" y2="626" class="rule"/>
  <line x1="48" y1="650" x2="84" y2="650" stroke="#0f766e" stroke-width="2"/>
  <text x="94" y="654" class="sans micro">complete proxied exchange</text>
  <line x1="284" y1="650" x2="320" y2="650" stroke="#343431" stroke-width="1.6" stroke-dasharray="6 6"/>
  <text x="330" y="654" class="sans micro">plugin summary and lifecycle</text>
  <text x="1152" y="654" text-anchor="end" class="sans micro">R2 and D1 remain canonical for saved memory</text>
</svg>
