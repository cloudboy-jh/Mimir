name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version: '1.25.x'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:plugins
      - run: bun install --frozen-lockfile
        working-directory: worker/web
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker
      - run: npm test
        working-directory: worker
      - run: bun test plugins/opencode/
      - run: python -m unittest discover -s plugins/hermes -p "test_*.py"
      - run: npm run test:migrations
        working-directory: worker
      - run: npm run build:dashboard && npx wrangler deploy --dry-run
        working-directory: worker
      - run: bun run check:demo-assets
      - run: bun run verify:dashboard-builds
      - run: go test ./...
      - run: go mod verify
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check

  native-install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version: '1.25.x'
      - run: go test ./internal/install ./internal/harness/hooks ./internal/harness/lifecycle ./internal/doctor
      - run: go build -o ${{ runner.temp }}/mimir${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/mimir
