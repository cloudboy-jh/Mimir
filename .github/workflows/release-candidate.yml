name: release-candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      candidate_ref: ${{ inputs.commit }}

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version: "1.25.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - name: Validate candidate identity
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git merge-base --is-ancestor "$COMMIT" origin/master
          ! git ls-remote --exit-code --tags origin "refs/tags/$TAG"
          git tag "$TAG"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --skip=publish
      - name: Stage candidate payload
        run: |
          mkdir release-payload
          cp dist/*.tar.gz dist/*.zip dist/checksums.txt install.sh install.ps1 release-payload/
      - name: Generate candidate manifest
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: bun run release:evidence -- candidate --payload release-payload --tag "$TAG" --commit "$COMMIT" --run-id "${GITHUB_RUN_ID}" --repository "${GITHUB_REPOSITORY}" --out candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.tag }}
          retention-days: 30
          if-no-files-found: error
          path: |
            candidate.json
            release-payload/
