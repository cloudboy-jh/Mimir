name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - name: Download matching approved evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=release-evidence-${TAG}" --jq '.artifacts | map(select(.expired == false)) | if length == 1 then .[0].id else error("expected exactly one approved evidence artifact") end')"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > evidence.zip
          unzip -q evidence.zip -d evidence
      - name: Verify candidate and evidence
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: bun run release:evidence -- verify-release --candidate evidence/candidate.json --evidence evidence/evidence.json --payload evidence/release-payload --expected-tag "$TAG" --expected-commit "$COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ github.ref_name }}
          path: evidence/
          if-no-files-found: error

  goreleaser:
    needs: evidence
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-${{ github.ref_name }}
          path: evidence
      - name: Publish verified candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" evidence/release-payload/* evidence/candidate.json evidence/evidence.json --verify-tag --generate-notes
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            evidence/release-payload/*
            evidence/candidate.json
            evidence/evidence.json
