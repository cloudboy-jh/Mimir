name: release-evidence

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        required: true
        type: string
      manifest_base64:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  approve:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install --frozen-lockfile
      - name: Download candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.conclusion')" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.event')" = workflow_dispatch
          case "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.path')" in
            .github/workflows/release-candidate.yml*) ;;
            *) exit 1 ;;
          esac
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts | map(select(.name | startswith("release-candidate-"))) | if length == 1 then .[0].id else error("candidate artifact missing") end')"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > candidate.zip
          unzip -q candidate.zip -d candidate
      - name: Decode evidence manifest
        env:
          MANIFEST_BASE64: ${{ inputs.manifest_base64 }}
        run: python -c "import base64,os;open('evidence.json','wb').write(base64.b64decode(os.environ['MANIFEST_BASE64'],validate=True))"
      - name: Validate evidence
        env:
          ACTOR: ${{ github.actor }}
        run: bun run release:evidence -- validate --candidate candidate/candidate.json --evidence evidence.json --payload candidate/release-payload --expected-actor "$ACTOR"
      - name: Read candidate tag
        id: candidate
        run: echo "tag=$(jq -r .tag candidate/candidate.json)" >> "$GITHUB_OUTPUT"
      - name: Stage approved evidence
        run: |
          mkdir -p approved/release-payload
          cp candidate/candidate.json evidence.json approved/
          cp candidate/release-payload/* approved/release-payload/
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ steps.candidate.outputs.tag }}
          retention-days: 30
          if-no-files-found: error
          path: approved/
